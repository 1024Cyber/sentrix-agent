name: Build Sentrix APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 4. Permissions ───────────────────────────────────────────────────
      - name: Grant execute permission
        run: chmod +x gradlew

      # ── 5. Debug APK (always runs) ────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 6. Release APK — build unsigned (main branch only) ───────────────
      - name: Build Release APK (unsigned)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./gradlew assembleRelease --stacktrace

      # ── 7. Generate or decode keystore, then sign with apksigner ─────────
      #
      #  OPTION A — No secrets needed (default):
      #    A fresh JKS keystore is auto-generated each run.
      #    APK is signed and installable. Good for sideloading/testing.
      #    Note: cert differs each run — not for Play Store.
      #
      #  OPTION B — Permanent keystore (Play Store / production):
      #    Generate once on your machine (must use -storetype JKS):
      #      keytool -genkey -v -keystore sentrix.jks \
      #              -alias sentrix -keyalg RSA -keysize 2048 \
      #              -validity 10000 -storetype JKS \
      #              -dname "CN=Sentrix,OU=Dev,O=Sentrix,L=City,ST=State,C=US"
      #    Base64-encode it:
      #      base64 -w 0 sentrix.jks
      #    Add these four GitHub Secrets (repo Settings → Secrets → Actions):
      #      KEYSTORE_BASE64    ← output of the base64 command
      #      KEYSTORE_PASSWORD  ← your store password
      #      KEY_ALIAS          ← sentrix (or your chosen alias)
      #      KEY_PASSWORD       ← your key password
      #    The workflow auto-detects the secret and switches to Option B.
      #
      - name: Sign Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SECRET_KEYSTORE_B64:  ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS:      ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/sentrix-release.apk"

          # ── Prepare keystore ──
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "Option B: decoding keystore from secret"
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > sentrix.jks
            KS_PASS="$SECRET_KEYSTORE_PASS"
            KS_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="$SECRET_KEY_PASS"
          else
            echo "Option A: generating fresh JKS keystore"
            keytool -genkey -v \
              -keystore sentrix.jks \
              -alias sentrix \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sentrix123 \
              -keypass  sentrix123 \
              -dname "CN=Sentrix,OU=Mobile,O=Sentrix,L=Unknown,ST=Unknown,C=US" \
              -noprompt
            KS_PASS="sentrix123"
            KS_ALIAS="sentrix"
            KEY_PASS="sentrix123"
          fi

          # ── Locate apksigner (comes with Android build tools) ──
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"

          # ── Sign the unsigned APK ──
          $APKSIGNER sign \
            --ks sentrix.jks \
            --ks-pass pass:"$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass pass:"$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "APK signed → $SIGNED_APK"

          # ── Verify signature ──
          $APKSIGNER verify --verbose "$SIGNED_APK"

          # ── Clean up keystore from runner ──
          rm -f sentrix.jks

      # ── 8. Upload signed release APK ─────────────────────────────────────
      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/sentrix-release.apk
          retention-days: 90

      # ── 9. Summary ───────────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "=== Sentrix Build Complete ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
