name: Build Sentrix APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (required by AGP 8.x) ──────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Cache Gradle dependencies (speeds up subsequent builds) ────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 4. Make gradlew executable ────────────────────────────────────────
      - name: Grant execute permission
        run: chmod +x gradlew

      # ── 5. Build debug APK (always built — no signing needed) ────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── 6. Upload debug APK as artifact ──────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 7. Build release APK (only on push to main, requires secrets) ─────
      #
      #  To enable release builds, add these GitHub Secrets:
      #    KEYSTORE_BASE64   → base64-encoded .jks keystore file
      #    KEYSTORE_PASSWORD → keystore password
      #    KEY_ALIAS         → key alias
      #    KEY_PASSWORD      → key password
      #
      #  Generate keystore:
      #    keytool -genkey -v -keystore sentrix.jks -alias sentrix \
      #            -keyalg RSA -keysize 2048 -validity 10000
      #  Encode it:
      #    base64 -w 0 sentrix.jks > sentrix.jks.b64
      #
      - name: Decode Keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/sentrix.jks
        continue-on-error: true

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KEYSTORE_PATH:     sentrix.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
        continue-on-error: true

      # ── 8. Print APK info ─────────────────────────────────────────────────
      - name: APK Info
        run: |
          echo "Build complete"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
