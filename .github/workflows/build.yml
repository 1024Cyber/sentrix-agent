name: Build Sentrix APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 4. Permissions ───────────────────────────────────────────────────
      - name: Grant execute permission
        run: chmod +x gradlew

      # ── 5. Debug APK (always runs, no signing needed) ────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 6. Keystore setup (release builds on main only) ───────────────────
      #
      #  HOW SIGNING WORKS:
      #
      #  Option A — No secrets (default, works out of the box):
      #    The workflow auto-generates a fresh keystore on every run.
      #    APK is signed and installable. Use this for development/testing.
      #    Note: cert changes each run — not suitable for Play Store.
      #
      #  Option B — Your own permanent keystore (for Play Store):
      #    1. Generate a JKS keystore (MUST use -storetype JKS):
      #         keytool -genkey -v -keystore sentrix.jks \
      #                 -alias sentrix -keyalg RSA -keysize 2048 \
      #                 -validity 10000 -storetype JKS \
      #                 -dname "CN=Sentrix,OU=Dev,O=Sentrix,L=City,ST=State,C=US"
      #    2. Base64-encode it:
      #         base64 -w 0 sentrix.jks
      #    3. Add these four GitHub Secrets (Settings → Secrets → Actions):
      #         KEYSTORE_BASE64    ← output of the base64 command above
      #         KEYSTORE_PASSWORD  ← store password you chose
      #         KEY_ALIAS          ← sentrix (or whatever alias you used)
      #         KEY_PASSWORD       ← key password you chose
      #    The workflow auto-detects the secret and switches to Option B.
      #
      # ─────────────────────────────────────────────────────────────────────

      # Resolve which keystore option to use.
      # Writes KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # into $GITHUB_ENV so the Gradle step picks them up regardless of option.
      - name: Prepare Signing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          # These will be empty strings when the secrets don't exist — that's fine
          SECRET_KEYSTORE_B64:  ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            # ── Option B: decode keystore from secret ──
            echo "Using provided keystore (Option B)"
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > app/sentrix.jks
            echo "KEYSTORE_PATH=app/sentrix.jks"         >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS"           >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASS"         >> $GITHUB_ENV
          else
            # ── Option A: generate keystore fresh ──
            echo "No keystore secret found — generating fresh keystore (Option A)"
            keytool -genkey -v \
              -keystore app/sentrix.jks \
              -alias sentrix \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sentrix123 \
              -keypass  sentrix123 \
              -dname "CN=Sentrix,OU=Mobile,O=Sentrix,L=Unknown,ST=Unknown,C=US" \
              -noprompt
            echo "KEYSTORE_PATH=app/sentrix.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=sentrix123"  >> $GITHUB_ENV
            echo "KEY_ALIAS=sentrix"             >> $GITHUB_ENV
            echo "KEY_PASSWORD=sentrix123"       >> $GITHUB_ENV
          fi

      # ── 7. Release APK ───────────────────────────────────────────────────
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # ── 8. Summary ───────────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "=== Sentrix Build Complete ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
