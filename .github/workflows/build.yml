name: Build Sentrix APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 4. Permissions ───────────────────────────────────────────────────
      - name: Grant execute permission
        run: chmod +x gradlew

      # ── 5. Debug APK (no signing needed, always runs) ────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 6. Release keystore ───────────────────────────────────────────────
      #
      #  TWO WAYS to provide a keystore — pick ONE:
      #
      #  OPTION A (recommended — GitHub generates it): no secrets needed.
      #    The workflow generates a fresh keystore on every run using
      #    -storetype JKS which is fully compatible with Android tooling.
      #    The APK is signed and uploadable. The keystore is ephemeral
      #    (recreated each run) so the cert changes each time — fine for
      #    sideloading, not for Play Store. When you're ready for Play Store,
      #    switch to Option B.
      #
      #  OPTION B (bring your own keystore): add these GitHub Secrets:
      #    KEYSTORE_BASE64   → base64 of a JKS keystore (see note below)
      #    KEYSTORE_PASSWORD → store password
      #    KEY_ALIAS         → key alias inside the store
      #    KEY_PASSWORD      → key password
      #
      #    IMPORTANT: generate with -storetype JKS, not PKCS12:
      #      keytool -genkey -v -keystore sentrix.jks \
      #              -alias sentrix -keyalg RSA -keysize 2048 \
      #              -validity 10000 -storetype JKS \
      #              -dname "CN=Sentrix, OU=Dev, O=Sentrix, L=City, S=State, C=US"
      #      base64 -w 0 sentrix.jks   ← copy this output as KEYSTORE_BASE64
      #
      #    Then set OPTION below to "B" and comment out the Option A block.
      #
      # ─────────────────────────────────────────────────────────────────────

      # OPTION A — generate keystore fresh (default, no secrets needed)
      - name: Generate Keystore (Option A)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkey -v \
            -keystore app/sentrix.jks \
            -alias sentrix \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -storepass sentrix123 \
            -keypass sentrix123 \
            -dname "CN=Sentrix, OU=Mobile, O=Sentrix, L=Unknown, S=Unknown, C=US" \
            -noprompt
          echo "KEYSTORE_PATH=app/sentrix.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=sentrix123"  >> $GITHUB_ENV
          echo "KEY_ALIAS=sentrix"             >> $GITHUB_ENV
          echo "KEY_PASSWORD=sentrix123"        >> $GITHUB_ENV

      # OPTION B — decode keystore from secret
      - name: Decode Keystore (Option B)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/sentrix.jks
          echo "KEYSTORE_PATH=app/sentrix.jks"              >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"         >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"   >> $GITHUB_ENV

      # ── 7. Release APK ───────────────────────────────────────────────────
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # ── 8. Summary ───────────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "=== Build Complete ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
