name: Build Sentrix APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 4. Permissions ───────────────────────────────────────────────────
      - name: Grant execute permission
        run: chmod +x gradlew

      # ── 5. Debug APK (always runs, no signing needed) ────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 6. Prepare signing (release on main only) ─────────────────────────
      #
      #  OPTION A — No secrets needed (default):
      #    A fresh JKS keystore is generated automatically each run.
      #    APK is signed and installable. Good for dev/testing/sideloading.
      #    The signing cert changes each run — not suitable for Play Store.
      #
      #  OPTION B — Permanent keystore (for Play Store):
      #    1. Generate a JKS keystore (must use -storetype JKS):
      #         keytool -genkey -v -keystore sentrix.jks \
      #                 -alias sentrix -keyalg RSA -keysize 2048 \
      #                 -validity 10000 -storetype JKS \
      #                 -dname "CN=Sentrix,OU=Dev,O=Sentrix,L=City,ST=State,C=US"
      #    2. Base64-encode it (Linux/Mac):
      #         base64 -w 0 sentrix.jks
      #    3. Add these GitHub Secrets (repo → Settings → Secrets → Actions):
      #         KEYSTORE_BASE64    ← output of step 2
      #         KEYSTORE_PASSWORD  ← your store password
      #         KEY_ALIAS          ← sentrix (or alias you chose)
      #         KEY_PASSWORD       ← your key password
      #    The workflow auto-detects the secret and uses Option B.
      #
      - name: Prepare Signing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SECRET_KEYSTORE_B64:  ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "Using provided keystore (Option B)"
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > app/sentrix.jks
            echo "SENTRIX_KEYSTORE_PATH=app/sentrix.jks"      >> $GITHUB_ENV
            echo "SENTRIX_KEYSTORE_PASS=$SECRET_KEYSTORE_PASS" >> $GITHUB_ENV
            echo "SENTRIX_KEY_ALIAS=$SECRET_KEY_ALIAS"         >> $GITHUB_ENV
            echo "SENTRIX_KEY_PASS=$SECRET_KEY_PASS"           >> $GITHUB_ENV
          else
            echo "Generating fresh keystore (Option A)"
            keytool -genkey -v \
              -keystore app/sentrix.jks \
              -alias sentrix \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sentrix123 \
              -keypass  sentrix123 \
              -dname "CN=Sentrix,OU=Mobile,O=Sentrix,L=Unknown,ST=Unknown,C=US" \
              -noprompt
            echo "SENTRIX_KEYSTORE_PATH=app/sentrix.jks" >> $GITHUB_ENV
            echo "SENTRIX_KEYSTORE_PASS=sentrix123"       >> $GITHUB_ENV
            echo "SENTRIX_KEY_ALIAS=sentrix"              >> $GITHUB_ENV
            echo "SENTRIX_KEY_PASS=sentrix123"            >> $GITHUB_ENV
          fi

      # ── 7. Release APK ───────────────────────────────────────────────────
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sentrix-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # ── 8. Summary ───────────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "=== Sentrix Build Complete ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
