plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sentrix.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.sentrix.agent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // ── Signing config ────────────────────────────────────────────
            // Values are injected as environment variables by GitHub Actions.
            // OPTION A: auto-generated keystore — no secrets needed.
            // OPTION B: your own keystore — set KEYSTORE_BASE64 secret in GitHub.
            // Both options set the same env var names — no change needed here.
            //
            // To sign locally, set these in your shell before running assembleRelease:
            //   export KEYSTORE_PATH=/path/to/sentrix.jks
            //   export KEYSTORE_PASSWORD=yourpassword
            //   export KEY_ALIAS=sentrix
            //   export KEY_PASSWORD=yourpassword
            // ─────────────────────────────────────────────────────────────
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: ""
            def keystorePass = System.getenv("KEYSTORE_PASSWORD") ?: ""
            def keyAlias     = System.getenv("KEY_ALIAS") ?: ""
            def keyPass      = System.getenv("KEY_PASSWORD") ?: ""

            if (keystorePath && keystorePass && keyAlias && keyPass) {
                storeFile     file(keystorePath)
                storePassword keystorePass
                keyAlias      keyAlias
                keyPassword   keyPass
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // WebSocket
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
